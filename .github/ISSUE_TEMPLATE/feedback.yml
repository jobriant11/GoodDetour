name: Product feedback
description: Share an idea or tell us how Good Detour could be more useful.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve Good Detour. This submission is public. Never include private URLs, browsing history, account details, or other sensitive information."
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - Feature idea
        - Usability improvement
        - Destination suggestion
        - Privacy or trust feedback
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Tell us more
      description: Describe the outcome you want. Use example.com-style placeholders instead of real private URLs.
      placeholder: It would help me if…
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why would this help?
      description: Optional context about the workflow or problem, without browsing history or sensitive details.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this public submission contains no private URLs, browsing history, credentials, or sensitive personal information.
          required: true
