<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>A Good Detour</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="landing">
    <main class="card landing-card">
      <span class="mark" aria-hidden="true">↗</span>
      <p class="eyebrow">Good Detour</p>
      <h1 id="landing-title">A small pause can change the next hour.</h1>
      <p id="landing-message" class="lead"></p>
      <p id="route" class="notice"></p>
      <p id="countdown" class="countdown"></p>
      <div class="landing-actions">
        <button id="go-now" class="button" type="button">Go now</button>
        <button id="stay" class="button secondary" type="button">Stay on this pause</button>
        <button id="disable" class="button ghost" type="button">Turn this rule off</button>
      </div>
      <p id="landing-error" class="notice error hidden"></p>
    </main>
    <script type="module" src="landing.js"></script>
  </body>
</html>
